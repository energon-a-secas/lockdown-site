<head>

  <meta name="description" content="Scan websites for exposed endpoints, missing headers, open files, and SEO gaps. Get a downloadable report with hardening tips">
  <meta property="og:title" content="Lockdown: Site Security Scanner">
  <meta property="og:description" content="Scan any site for security gaps, exposed files, and missing basics">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lockdown.neorgon.com/">
  <meta property="og:site_name" content="Neorgon">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Lockdown: Site Security Scanner">
  <meta name="twitter:description" content="Scan any site for security gaps, exposed files, and missing basics">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://lockdown.neorgon.com/">
  <meta property="og:locale" content="en_US">
  <meta name="theme-color" content="#040714">
  <meta property="og:image" content="https://lockdown.neorgon.com/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://lockdown.neorgon.com/og-preview.jpg">

  <!-- Neorgon Header Kit (vendored; ?header=live swaps CSS to CDN) -->
  <script>(function(){var m=location.search.match(/[?&]theme=([\w-]+)/)||document.cookie.match(/(?:^|;\s*)neo_theme=([\w-]+)/);if(m&&m[1]!=='default')document.documentElement.dataset.theme=decodeURIComponent(m[1]);})();</script>
  <link rel="stylesheet" href="css/neorgon-header.css">
  <link rel="stylesheet" href="css/neorgon-themes.css">
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/header/season.css">
  <script defer src="js/neorgon-header.js"></script>
  <meta name="neo-repo" content="energon-a-secas/lockdown-site">
  <link rel="stylesheet" href="css/neorgon-footer.css">
  <script defer src="js/neorgon-footer.js"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Lockdown",
    "description": "Scan websites for exposed endpoints, missing headers, open files, and SEO gaps. Get actionable hardening tips",
    "url": "https://lockdown.neorgon.com/",
    "applicationCategory": "SecurityApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Organization", "name": "Neorgon", "url": "https://neorgon.com/" }
  }
  </script>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header-bar" data-header-mode="content">
    <div class="header-logo">
      <a href="./" class="header-title-link">
        <img src="https://cdn.neorgon.org/v1.0.0/energon-classic-logo.png" class="header-logo-img" alt="">
        <div class="header-title-wrap">
        <h1>Lockdown</h1>
        <div class="header-subtitle">Site Security Scanner</div>
      
        </div>
      </a>
    </div>
    <div class="header-right">
      <a class="header-home" href="https://neorgon.com/" title="neorgon.com" aria-label="Neorgon home">
        <svg class="nh-hub-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="4.4"/>
          <ellipse cx="12" cy="12" rx="8.4" ry="3" transform="rotate(-18 12 12)"/>
          <g class="nh-orbit">
            <path d="M17.5 4.2 14.2 2.7l.9 1.4-.6 1.1z" fill="currentColor" stroke="none"/>
            <circle cx="12.6" cy="3" r=".7" fill="currentColor" stroke="none" opacity=".55"/>
            <circle cx="11.1" cy="3.3" r=".55" fill="currentColor" stroke="none" opacity=".35"/>
            <circle cx="9.8" cy="3.7" r=".4" fill="currentColor" stroke="none" opacity=".2"/>
          </g>
        </svg>
      </a>
    </div>
  </header>

  <main id="main">
    <div class="container">

      <!-- Scanner -->
      <div id="scannerView">

        <!-- URL input -->
        <div class="card scan-input-card">
          <label class="input-label" for="targetUrl">Target URL</label>
          <div class="url-row">
            <input type="url" id="targetUrl" placeholder="https://example.com" autocomplete="url">
            <button class="btn btn-primary" id="scanBtn">
              <span id="scanBtnText">Scan</span>
              <span id="scanBtnSpinner" class="spinner" hidden></span>
            </button>
          </div>
          <div class="scan-error" id="scanError"></div>
          <details class="fuzz-paths-toggle">
            <summary>Custom fuzz paths (optional)</summary>
            <label class="input-label" for="fuzzPaths" style="margin-top:var(--space-3)">Base paths to fuzz</label>
            <input type="text" id="fuzzPaths" placeholder="/api, /api/v1, /api/v2, /graphql" autocomplete="off">
            <p class="fuzz-hint">Comma-separated base paths. Defaults to /api, /api/v1, /api/v2 if empty.</p>
          </details>
        </div>

        <!-- Progress -->
        <div class="card progress-card" id="progressCard" hidden>
          <div class="progress-header">
            <span class="progress-label" id="progressLabel">Starting scan...</span>
            <span class="progress-pct" id="progressPct">0%</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressFill"></div>
          </div>
        </div>

        <!-- Results -->
        <div id="resultsView" hidden>
          <div class="results-header">
            <div class="results-summary">
              <span class="score-badge" id="scoreBadge"></span>
              <span class="results-url" id="resultsUrl"></span>
            </div>
            <button class="btn btn-secondary" id="downloadBtn">Download Report</button>
          </div>

          <div class="category-tabs" id="categoryTabs"></div>
          <div id="findingsContainer"></div>
          <div id="networkLog"></div>
        </div>

      </div>
    </div>
  </main>

  <footer class="neo-footer" data-footer-mode="minimal">
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
